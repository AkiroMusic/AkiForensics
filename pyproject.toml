[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akiforensics"
version = "0.3.1"
description = "Forensic toolkit for detecting AI-generated music (Suno-style): beat-grid timing, lossy-cutoff and metadata chain analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
akiforensics = "akiforensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
